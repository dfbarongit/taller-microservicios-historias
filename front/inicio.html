<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de historias de usuario</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-shell">

        
        <header class="topbar">
            <h1>Gestor de historias de usuario</h1>
            <nav>
                <ul>
                    <li><a class="active" href="inicio.html">Sprints</a></li>
                    <li><a href="informes.html">Informes</a></li>
                </ul>
            </nav>
        </header>

        <div class="app-layout">

            
            <aside class="sidebar">
                <nav class="sprint-nav">
                    <ul id="ulNav">
                        <li>Cargando sprints...</li>
                    </ul>
                    <a class="new-link" href="sprint_form.html">Nuevo Sprint</a>
                </nav>
            </aside>

            <main class="main-content">

                
                <p id="mensajeError" class="error-message" hidden>
                    Error al guardar los datos del usuario!!!
                </p>

                
                <section class="sprint-header" id="infoSprint">
                    <div class="sprint-header-title">
                        <h2 id="tituloSprint">Cargando...</h2>
                    </div>
                    <div class="actions">
                        <a id="btnModificarSprint" href="#">Modificar sprint</a>
                        <button id="btnEliminarSprint" class="danger-link" type="button">Eliminar sprint</button>
                    </div>
                </section>

                
                <a id="btnCrearHistoria" class="button button-primary create-story" href="#">Crear nueva historia</a>

                <div id="dHistorias" class="story-grid">
                    <p class="empty-state">Cargando historias...</p>
                </div>

            </main>
        </div>
    </div>

    <script src="inicio.js"></script>
</body>
</html>
